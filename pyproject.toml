[tool.poetry]
name = "neural-aspect-rag"
version = "0.1.0"
description = "Experiment to build a RAG system using neural aspect data"
authors = ["Gareth Davies <garethmd@googlemail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.1.0"
ipykernel = "^6.29.5"
dotenv = "^0.9.9"
pydantic = "^2.11.2"
pandas = "^2.2.3"
openai = "^1.71.0"
psycopg = "^3.2.6"
instructor = "^1.7.9"
psycopg2-binary = "^2.9.10"
timescale-vector = "^0.0.7"
anthropic = "^0.49.0"
firecrawl-py = "^2.1.2"
llama-index = "^0.12.32"
scikit-learn = "^1.6.1"
torch = "2.7.0"
langfuse = "^2.60.3"
google-genai = "^1.13.0"
llama-index-embeddings-openai = "^0.3.1"
llama-index-vector-stores-postgres = "^0.5.1"
sqlalchemy = "^2.0.40"
more-itertools = "^10.7.0"
cohere = "^5.15.0"
fastapi = "^0.115.12"
uvicorn = "^0.34.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
